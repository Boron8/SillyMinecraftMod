buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven {
            name = "jitpack"
            url = "https://jitpack.io"
        }
        flatDir {
            dirs 'libs'
        }
    }
    dependencies {
        classpath ('com.github.GTNewHorizons:ForgeGradle:1.2.11') {
            changing = true
        }
    }
}

apply plugin: 'forge'

version = "0.1"
group = "me.creeper.creepermodtest" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "creepermodtest"
def modid = "creepermodtest"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "C:/eclipse"
}

dependencies {
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
      
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    compile "org.luaj:luaj-jse:3.0.2"
}

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

repositories {
    mavenCentral()
    maven {
        name = "forge"
        url = "https://maven.minecraftforge.net/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/repositories/snapshots/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    flatDir {
        dirs 'libs'
    }
}



// -- MIXIN SHIT --

def unimixinsVersion = "0.1.14"
dependencies {
    compile("com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:$unimixinsVersion:dev")
}


configurations.compile.dependencies.each {
    if (it instanceof ExternalModuleDependency) {
        it.exclude module: "SpongeMixins"
        it.exclude module: "SpongePoweredMixin"
        it.exclude module: "00gasstation-mc1.7.10"
        it.exclude module: "gtnhmixins"
    }
}

runClient {
    args(
            "--tweakClass", "org.spongepowered.asm.launch.MixinTweaker"
    )
}

runServer {
    args(
            "--tweakClass", "org.spongepowered.asm.launch.MixinTweaker"
    )
}

def outSrgFile = "${tasks.compileJava.temporaryDir}/outSrg.srg"
def outRefMapFile = "${tasks.compileJava.temporaryDir}/mixins.${modid}.refmap.json"


jar {
    manifest {
            attributes (
                    'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
                    'MixinConfigs': "mixins.creepermodtest.json"
            )
    }

    from outRefMapFile
}

tasks.compileJava.options.compilerArgs += [
        "-AreobfSrgFile=${tasks.reobf.srg}",
        "-AoutSrgFile=${outSrgFile}",
        "-AoutRefMapFile=${outRefMapFile}"
]

reobf {
    addExtraSrgFile outSrgFile
}